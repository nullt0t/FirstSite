<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Null in Cyberia — writings, drawings, moving images, and things worth keeping." />
  <title>Null in Cyberia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kode+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=20261018-face" />
  <script src="script.js?v=20261027-1" defer></script>
  <script src="scrollbars.js?v=20260927-9" defer></script>
</head>
<body>
  <a class="skip-link" href="#content-window">Skip to content</a>
  <main class="site-grid">
    <header class="masthead">
      <h1 id="site-title">Digitally Free,<br />Spiritually in Love</h1>
    </header>
    <nav class="layers" aria-labelledby="layers-title">
      <h2 class="bar-title" id="layers-title">Layers</h2>
      <div class="layer-tree" id="layer-tree"></div>
    </nav>
    <section class="workspace" aria-label="Archive window">
      <div class="tab-strip">
        <div class="tabs" id="tabs" role="tablist" aria-label="Open layers"></div>
        <span class="tab-count" id="tab-count" aria-label="0 of 7 tabs open">0 / 7</span>
      </div>
      <p class="tab-message" id="tab-message" role="status" hidden></p>
      <div class="content-window" id="content-window" tabindex="-1">
        <template id="entry-point-template">
        <div class="welcome-panel">
          <h2>What brings you here? <span class="welcome-face">(,,¬﹏¬,,)</span></h2>
          <p>Cyberia - "Where common laws of nature are no longer enforced."</p>
        </div>
        </template>
        <div id="panels"></div>
      </div>
    </section>
    <aside class="right-rail" aria-label="Now and elsewhere">
      <section class="symbol" aria-labelledby="symbol-title">
        <h2 class="bar-title" id="symbol-title">Alive/Breath</h2>
        <div class="symbol-space">
          <div class="symbol-image" id="symbol-image"></div>
          <section class="connection-panel" id="connection-panel" aria-labelledby="connection-title" hidden>
            <div class="connection-heading">
              <h3 id="connection-title"></h3>
              <button class="close-button" id="close-connection" type="button" aria-label="Close information and return to Alive/Breath">×</button>
            </div>
            <div id="connection-body"></div>
          </section>
        </div>
      </section>
      <section class="recommendations" aria-labelledby="recommendations-title">
        <h2 class="bar-title" id="recommendations-title">The On Repeats</h2>
        <ul id="recommendation-list"></ul>
      </section>
      <section class="beyond" aria-labelledby="beyond-title">
        <h2 class="bar-title" id="beyond-title">Beyond Here</h2>
        <div class="beyond-links">
          <button type="button" data-connection="friends" aria-controls="connection-panel" aria-expanded="false">Other Places</button>
        </div>
      </section>
    </aside>
  </main>
  <noscript><p class="noscript-note">Enable JavaScript to open the archive layers.</p></noscript>
</body>
</html>
